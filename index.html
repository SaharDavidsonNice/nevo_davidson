<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nevo Davidson</title>
  <meta name="description" content="Nevo Davidson — links and contact.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --accent: #2f5bea;
      --accent-text: #ffffff;
      --border: #e4e2dd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --card: #1c1c1f;
        --text: #f2f2f3;
        --muted: #a0a0a8;
        --accent: #6d8dff;
        --accent-text: #0b0b0c;
        --border: #2c2c30;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 32px;
      font-weight: 700;
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .tagline { margin: 0 0 24px; color: var(--muted); }
    .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .links a {
      display: block;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: border-color .15s, transform .15s;
    }
    .links a:hover, .links a:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
    .links a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    footer { margin-top: 24px; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">ND</div>
    <h1>Nevo Davidson</h1>
    <p class="tagline">Welcome! Here's where to find me.</p>

    <!-- Edit these links, then push to main — the live page updates automatically. -->
    <ul class="links">
      <li><a class="primary" href="mailto:hello@example.com">Email me</a></li>
      <li><a href="https://github.com/SaharDavidsonNice">GitHub</a></li>
      <li><a href="https://www.linkedin.com/">LinkedIn</a></li>
    </ul>

    <footer>Last updated: <time datetime="2026-10-18">October 2026</time></footer>
  </main>
</body>
</html>
